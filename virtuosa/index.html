<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>

    <meta http-equiv="refresh" content="2;url=https://pay.kiwify.com.br/D4R76sE">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #ffffff; /* Fundo Branco Limpo */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* O container começa invisível (display: none) */
        #conteudo-resgate {
            display: none; 
            text-align: center;
        }

        .btn {
            background-color: #27ae60; /* Verde Sucesso */
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #219150;
            transform: scale(1.05);
        }
        p {
            color: #555;
            margin-bottom: 20px;
        }
    </style>

    <script>
        // Tenta ir imediatamente
        window.location.replace("https://pay.kiwify.com.br/D4R76sE");
    </script>
</head>
<body>

    <div id="conteudo-resgate">
        <p>O redirecionamento está demorando mais que o normal...</p>
        <a href="https://pay.kiwify.com.br/D4R76sE" class="btn">
            CLIQUE AQUI PARA ACESSAR
        </a>
    </div>

    <script>
        // Lógica do "Timer":
        // Se a pessoa ainda estiver aqui depois de 2.0 segundos (2000ms),
        // mostramos o botão de resgate.
        setTimeout(function() {
            document.getElementById('conteudo-resgate').style.display = 'block';
        }, 2000);
    </script>

</body>
</html>
